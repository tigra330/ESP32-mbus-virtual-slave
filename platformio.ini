[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1
    adafruit/Adafruit BME280 Library @ ^2.2.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
